name: PaseoDog web

# 푸시·릴리즈와 분리하여 승인된 수동 실행에서만 공개 웹을 배포한다.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: paseodog-web
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: android/package-lock.json
      - run: npm --prefix android ci
      - run: node scripts/build-web.mjs --output "$RUNNER_TEMP/paseodog-web"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/paseodog-web
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - uses: actions/deploy-pages@v4
        id: deployment
