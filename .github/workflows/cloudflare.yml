name: PaseoDog Cloudflare Pages

# 운영 토큰은 승인된 cloudflare-production environment의 배포 job에서만 주입한다.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: paseodog-cloudflare
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: android/package-lock.json
      - run: npm --prefix android ci
      - run: node scripts/build-web.mjs --hosting cloudflare --output "$RUNNER_TEMP/paseodog-pages"
      - uses: actions/upload-artifact@v4
        with:
          name: cloudflare-pages
          path: ${{ runner.temp }}/paseodog-pages
          if-no-files-found: error
          retention-days: 1
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: cloudflare-production
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: cloudflare-pages
          path: dist-pages
      # checkout이 없어 git 정보를 읽을 수 없으므로 production 브랜치와 커밋을 명시한다.
      - uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '4.152.0'
          command: pages deploy dist-pages --project-name=${{ vars.CLOUDFLARE_PAGES_PROJECT }} --branch=main --commit-hash=${{ github.sha }} --commit-dirty=false
