name: PaseoDog checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm run check
      - run: npm test
      - run: python3 scripts/package.py
      - name: Verify release ZIP really includes pinned lockfiles
        run: |
          python3 - <<'PY'
          import json, zipfile
          from pathlib import Path
          version = json.loads(Path('package.json').read_text())['version']
          with zipfile.ZipFile(Path('..') / f'PaseoDog-v{version}.zip') as archive:
              for sub in ('tools', 'engine', 'plugin'):
                  assert f'paseodog/{sub}/package-lock.json' in archive.namelist(), sub
          PY
  sdk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install SDK from committed lockfile
        run: npm --prefix plugin ci
      - run: npm run typecheck
  native-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install native dependency using locked nested layout (no model credentials)
        run: npm --prefix engine ci --install-strategy=nested
      - run: node scripts/patch-mixdog.mjs
      - run: node engine/bin/paseodog-engine.mjs --check
  lockfiles:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify committed dependency lockfiles
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          for(const folder of ['tools','engine','plugin']){
              const pkg=JSON.parse(fs.readFileSync(`${folder}/package.json`));
              const lock=JSON.parse(fs.readFileSync(`${folder}/package-lock.json`));
              if(lock.lockfileVersion!==3 || lock.name!==pkg.name || lock.version!==pkg.version
                  || lock.packages?.['']?.version!==pkg.version)
                  throw Error(`${folder}: mismatched pinned lockfile`);
              for(const [name,version] of Object.entries({...pkg.dependencies,...pkg.devDependencies})){
                  const pinned=lock.packages?.['']?.dependencies?.[name] || lock.packages?.['']?.devDependencies?.[name];
                  if(pinned!==version)throw Error(`${folder}: unlocked root dependency ${name}`);
              }
              console.log(`${folder}: validated ${Object.keys(lock.packages).length} pinned entries`);
          }
          JS
      - name: Install Paseo CLI exactly as shipped
        run: npm --prefix tools ci
      - run: git diff --exit-code -- tools/package-lock.json engine/package-lock.json plugin/package-lock.json
