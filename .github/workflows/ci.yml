name: PaseoDog checks
on:
  # 릴리즈 tag push는 같은 커밋의 main push와 중복 실행되므로 브랜치 push만 검사한다.
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm run check
      - name: Install root test dependencies from committed lockfiles
        run: |
          npm --prefix tools ci
          # 설치 스크립트와 같은 준비 로직으로 composer 패치의 검토된 web-ui 입력을 고정한다.
          node scripts/prepare-paseo-web-ui.mjs
          node scripts/install.mjs --engine-dependencies-only
          npm --prefix plugin ci
          # Root tests also import Expo/desktop source and installed Android packages.
          # Never run Android workspace install hooks in this read-only CI setup.
          npm --prefix android ci --ignore-scripts
          # Root tests import the built protocol package, as the daemon updater prepares it.
          npm --prefix android run build:protocol
          # The release web check launches the lockfile's Playwright headless Chromium.
          android/node_modules/.bin/playwright install --with-deps --only-shell chromium
      - name: Verify controls EPIPE regression before web bundle integration tests
        run: node --test --test-name-pattern="control daemon stdin failures" tests/engine-controls.test.mjs
      - name: Apply and verify pinned runtime patches
        # 설치와 같은 패치 목록·순서를 쓴다.
        run: node scripts/install.mjs --patches-only
      # scripts/test.mjs keeps its lock and scratch files under the release host's scratch root.
      - name: Create the test scratch root
        run: sudo install -d -o "$USER" /data/tmp/ubuntu
      - run: npm test
      - run: python3 scripts/package.py
      - name: Verify release ZIP really includes pinned lockfiles
        run: |
          python3 - <<'PY'
          import json, zipfile
          from pathlib import Path
          version = json.loads(Path('package.json').read_text())['version']
          with zipfile.ZipFile(Path('..') / f'PaseoDog-v{version}.zip') as archive:
              for sub in ('tools', 'engine', 'plugin'):
                  assert f'paseodog/{sub}/package-lock.json' in archive.namelist(), sub
          PY
  sdk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install SDK from committed lockfile
        run: npm --prefix plugin ci
      - run: npm run typecheck
  native-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install native dependency using locked nested layout (no model credentials)
        run: node scripts/install.mjs --engine-dependencies-only
      - run: node scripts/patch-mixdog.mjs
      - run: node engine/bin/paseodog-engine.mjs --check
  lockfiles:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify committed dependency lockfiles
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          for(const folder of ['tools','engine','plugin']){
              const pkg=JSON.parse(fs.readFileSync(`${folder}/package.json`));
              const lock=JSON.parse(fs.readFileSync(`${folder}/package-lock.json`));
              if(lock.lockfileVersion!==3 || lock.name!==pkg.name || lock.version!==pkg.version
                  || lock.packages?.['']?.version!==pkg.version)
                  throw Error(`${folder}: mismatched pinned lockfile`);
              for(const [name,version] of Object.entries({...pkg.dependencies,...pkg.devDependencies})){
                  const pinned=lock.packages?.['']?.dependencies?.[name] || lock.packages?.['']?.devDependencies?.[name];
                  if(pinned!==version)throw Error(`${folder}: unlocked root dependency ${name}`);
              }
              console.log(`${folder}: validated ${Object.keys(lock.packages).length} pinned entries`);
          }
          JS
      - name: Install Paseo CLI exactly as shipped
        run: npm --prefix tools ci
      - run: git diff --exit-code -- tools/package-lock.json engine/package-lock.json plugin/package-lock.json
