name: PaseoDog checks
on:
  # 릴리즈 tag push는 같은 커밋의 main push와 중복 실행되므로 브랜치 push만 검사한다.
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm run check
      - name: Install root test dependencies from committed lockfiles
        run: |
          npm --prefix tools ci
          # 설치 스크립트와 같은 준비 로직으로 composer 패치의 검토된 web-ui 입력을 고정한다.
          node scripts/prepare-paseo-web-ui.mjs
          npm --prefix engine ci --install-strategy=nested
          npm --prefix plugin ci
          # Root tests also import Expo/desktop source and installed Android packages.
          # Never run Android workspace install hooks in this read-only CI setup.
          npm --prefix android ci --ignore-scripts
          # Root tests import the built protocol package, as the daemon updater prepares it.
          npm --prefix android run build:protocol
          # The release web check launches the lockfile's Playwright headless Chromium.
          android/node_modules/.bin/playwright install --with-deps --only-shell chromium
      - name: Verify controls EPIPE regression before web bundle integration tests
        run: node --test --test-name-pattern="control daemon stdin failures" tests/engine-controls.test.mjs
      - name: Apply and verify pinned runtime patches
        run: |
          for patch in mixdog paseo-usage paseo-steer paseo-agent-messages paseo-assistant-phase \
              paseo-workspace-name paseo-session-titles paseo-local-stt paseo-relay-password; do
            node "scripts/patch-${patch}.mjs"
            node "scripts/patch-${patch}.mjs" --check
          done
      # 루트 회귀 검사가 공유 UI의 실제 모듈과 Chromium 레이아웃을 실행한다.
      - name: Build shared UI test dependencies
        run: npm --prefix android run build:app-deps
      - name: Prepare Chromium for shared browser regressions
        working-directory: android
        run: npx playwright install --with-deps chromium
      # 테스트 잠금 파일을 만들 수 있도록 실행 계정 소유의 스크래치 경로를 준비한다.
      - name: Create the test scratch root
        run: sudo install -d -o "$USER" /data/tmp/ubuntu
      - run: npm test
      - run: python3 scripts/package.py
      - name: Verify release ZIP really includes pinned lockfiles
        run: |
          python3 - <<'PY'
          import json, zipfile
          from pathlib import Path
          version = json.loads(Path('package.json').read_text())['version']
          with zipfile.ZipFile(Path('..') / f'PaseoDog-v{version}.zip') as archive:
              for sub in ('tools', 'engine', 'plugin'):
                  assert f'paseodog/{sub}/package-lock.json' in archive.namelist(), sub
          PY
  sdk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install SDK from committed lockfile
        run: npm --prefix plugin ci
      - run: npm run typecheck
      - name: Check opt-in Android patch against audited Paseo source
        run: |
          # GitHub's immutable upstream file is checked by its Git blob SHA
          # before any edits. This does not build or install an Android APK.
          TARGET="$RUNNER_TEMP/paseo-source"
          mkdir -p "$TARGET/packages/app/src/terminal/native-renderer"
          curl --fail --location --silent --show-error --retry 2 --max-time 40 \
            https://raw.githubusercontent.com/getpaseo/paseo/166aabd57b3f6c69f6a6f65b621aba167e7e3be8/packages/app/src/terminal/native-renderer/terminal-input.native.tsx \
            -o "$TARGET/packages/app/src/terminal/native-renderer/terminal-input.native.tsx"
          node scripts/patch-paseo-android.mjs --check "$TARGET"
          node scripts/patch-paseo-android.mjs --apply "$TARGET"
          node scripts/patch-paseo-android.mjs --check "$TARGET"
          PASEODOG_ANDROID_PATCH_ROOT="$TARGET" node --input-type=module <<'JS'
          import { readFileSync } from 'node:fs';
          import { join } from 'node:path';
          import ts from './plugin/node_modules/typescript/lib/typescript.js';
          const source = join(process.env.PASEODOG_ANDROID_PATCH_ROOT,
              'packages/app/src/terminal/native-renderer/terminal-input.native.tsx');
          const syntax = ts.createSourceFile(source, readFileSync(source,'utf8'),
              ts.ScriptTarget.ESNext, true, ts.ScriptKind.TSX);
          if (syntax.parseDiagnostics.length) throw new Error(
              syntax.parseDiagnostics.map((d) => ts.flattenDiagnosticMessageText(d.messageText,'\n')).join('\n'));
          console.log('Audited upstream Android patch: applies and parses as TSX');
          JS
  native-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install native dependency using locked nested layout (no model credentials)
        run: npm --prefix engine ci --install-strategy=nested
      - run: node scripts/patch-mixdog.mjs
      - run: node engine/bin/paseodog-engine.mjs --check
  lockfiles:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify committed dependency lockfiles
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          for(const folder of ['tools','engine','plugin']){
              const pkg=JSON.parse(fs.readFileSync(`${folder}/package.json`));
              const lock=JSON.parse(fs.readFileSync(`${folder}/package-lock.json`));
              if(lock.lockfileVersion!==3 || lock.name!==pkg.name || lock.version!==pkg.version
                  || lock.packages?.['']?.version!==pkg.version)
                  throw Error(`${folder}: mismatched pinned lockfile`);
              for(const [name,version] of Object.entries({...pkg.dependencies,...pkg.devDependencies})){
                  const pinned=lock.packages?.['']?.dependencies?.[name] || lock.packages?.['']?.devDependencies?.[name];
                  if(pinned!==version)throw Error(`${folder}: unlocked root dependency ${name}`);
              }
              console.log(`${folder}: validated ${Object.keys(lock.packages).length} pinned entries`);
          }
          JS
      - name: Install Paseo CLI exactly as shipped
        run: npm --prefix tools ci
      - run: git diff --exit-code -- tools/package-lock.json engine/package-lock.json plugin/package-lock.json
