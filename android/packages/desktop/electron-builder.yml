npmRebuild: false
compression: normal
appId: sh.paseodog.desktop
productName: PaseoDog
executableName: PaseoDog
protocols:
  - name: PaseoDog agent link
    schemes:
      - paseo
afterPack: ./scripts/after-pack.js
afterSign: ./scripts/after-sign.js
directories:
  output: release
files:
  - dist/**/*
  - "!**/*.map"
  - "!node_modules/@getpaseo/*/src/**"
  - "!node_modules/@getpaseo/**/*.test.*"
  - "!node_modules/@getpaseo/**/*.spec.*"
  - "!node_modules/@getpaseo/server/dist/server/web-ui/**"
  - "!node_modules/@getpaseo/server/dist/server/builtin-plugins/**"
  # Workspace packages are symlinked, so anything a dev generates inside them
  # lands in the asar. CI never has these; a local .debug run adds gigabytes.
  - "!node_modules/@getpaseo/*/.debug/**"
  - "!node_modules/@getpaseo/*/.cache/paseodog-build/**"
  - "!node_modules/@getpaseo/*/.tasks/**"
  - "!node_modules/@getpaseo/*/conversations/**"
  - "!node_modules/@getpaseo/*/test-results/**"
  # afterPack에서 삭제하던 사용하지 않는 Claude 실행파일은 처음부터 복사하지 않는다.
  - "!node_modules/@anthropic-ai/claude-agent-sdk-*/**"
asarUnpack:
  - dist/daemon/node-entrypoint-runner.js
  - node_modules/@getpaseo/server/dist/server/terminal/shell-integration/**/*
extraResources:
  # Preserve physical compiler inputs, including .d.ts files omitted from packaged node_modules.
  - from: ../server/dist/server/builtin-plugins
    to: builtin-plugins
    filter:
      - "**/*"
      - "!copilot-usage-source/**"
      - "!claude-usage-source/**"
  - from: ../app/dist
    to: app-dist
    filter:
      - "**/*"
      - "!**/*.map"
  - from: assets/editor-targets
    to: editor-target-icons
publish:
  provider: github
  owner: moveju112
  repo: paseodog
mac:
  artifactName: "PaseoDog-${version}-${arch}.${ext}"
  minimumSystemVersion: "13.0.0"
  category: public.app-category.developer-tools
  icon: assets/icon.icns
  hardenedRuntime: true
  notarize: true
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.inherit.plist
  extraResources:
    - from: bin/paseo
      to: bin/paseo
    - from: assets/icon.png
      to: icon.png
  target:
    - dmg
    - zip
linux:
  files:
    - "!node_modules/sherpa-onnx-{darwin,win}-*/**"
  category: Development
  icon: assets
  artifactName: "PaseoDog-${version}-${arch}.${ext}"
  maintainer: "PaseoDog <hello@paseodog.dev>"
  vendor: "PaseoDog"
  extraResources:
    - from: bin/paseo
      to: bin/paseo
  target:
    - AppImage
    - deb
deb:
  afterInstall: scripts/linux-sandbox/after-install.tpl
rpm:
  afterInstall: scripts/linux-sandbox/after-install.tpl
appImage:
  # A nonempty argument list replaces builder's hardcoded --no-sandbox default.
  executableArgs: ["--class=PaseoDog"]
  artifactName: "PaseoDog-${version}-${arch}.${ext}"
win:
  files:
    - "!node_modules/sherpa-onnx-{darwin,linux}-*/**"
  artifactName: "PaseoDog-Setup-${version}-${arch}.${ext}"
  icon: assets/icon.ico
  signAndEditExecutable: false
  extraResources:
    - from: bin/paseo.cmd
      to: bin/paseo.cmd
  target:
    - target: nsis
      arch:
        - x64
nsis:
  include: scripts/installer.nsh
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
